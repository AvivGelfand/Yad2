נועה מרכזיים, תחנת הרכבת הקלה\r\n•\tדירה חדשה, ישירות מקבלן\r\n•\t ודאות במחיר השכירות לטווח ארוך.\r\n•\tכמעט כל מה שצריך נמצא מתחת לבניין (בתי עסק, חנויות, מרפאה, גן משחקים)\r\n•\tחיי קהילה מלאים ומגוונים \r\n•\t שכר דירה ידוע מראש ל- 10 שנים\r\n•\tשירותי תחזוקה שוטפת \r\n•\tמגוון חדרי דיירים (חדרי, אופניים ועגלות, מועדון דיירים ועוד)\r\n\r\nדירות 3 חדרים החל מ- 7,150 ₪\r\n\r\n\r\nאשטרום מגורים להשכרה– השקט הנפשי שלך \r\nאשטרום מגורים להשכרה מביאה את היציבות של אשטרום לשוק השכירות הבלתי צפוי. \r\nהחוסן הכלכלי של הקבוצה מאפשר לנו לספק לכם קרקע יציבה לטווח ארוך לכל לקוחותיה, בהתבסס על תפיסת מגורים מתקדמת ואטרקטיבית – בלי התחייבויות ובלי הפתעות. \r\nיש לכם גב באשטרום. \r\n\r\nבאשטרום מגורים להשכרה אנו משקיעים משאבים רבים בכל פרויקט, מהנראות החיצונית דרך החללים המשותפים ועד הדירות עצמן. חשיבה זו היא שמאפשרת ליצור חיי קהילה מודרניים וסביבת מגורים שמבינה את הצרכים של לקוחותינו . לשכונת אופי משפחתי וקהילה אכפתית שתגרום לכם להרגיש בבית מהרגע הראשון. \r\n\r\nהעוצמה של אשטרום, עכשיו בדירות להשכרה\r\nקבוצת אשטרום היא מחברות הבנייה והנדל\"ן הגדולות והוותיקות בישראל, עם ניסיון של למעלה מ- 60 שנה.  \r\nאשטרום מתעסקת גם בבניית תשתיות והנדסה, נכסי מסחר ומשרדים ואנרגיה מתחדשת. את העוצמה והמסירות הללו השקענו גם במאות דירות לשכירות הוגנת ברחבי הארץ, בבתים ששווה להשתקע בהם.  \r\n\r\n**המוצג לעיל ו/או להלן אינו מהווה הצעה מחייבת מטעם אשטרום הגדנ\"ע  שותפות מוגבלת וכפוף לשינויים. כל אחד מהפרטים המוצגים לגבי הפרויקט, לרבות נראות ו/או תמונות הדירות ו/או הבניינים ו/או סביבתם, מיקום הפרויקט ו/או הדירות, שכר הדירה, תכניות ו/או מפרטי הדירות, משך השכירות, תמהיל הדירות ו/או כל פרט ו/או נתון אחר נועד להמחשה בלבד, אינו מחייב את החברה ועשוי להשתנות בהתאם לשיקול דעת החברה ו/או דרישות הרשויות. ההתקשרות בפועל ו/או תנאיה כפופים לשיקול דעת החברה ו/או להסכם השכירות כפי שייחתם בין הצדדים בפועל. מבלי לגרוע מהאמור, התמונות ו/או הסרטונים לעיל ו/או להלן הינם הדמיה ונועדו להמחשה בלבד.","projectName":"אשטרום תל אביב","promotionText":"מהפכת השכירות בתל אביב","projectLogo":"https://cdn.yad2.treedis.com/projects/