ופכת את הבחירה במגורים בשכירות לבחירה חכמה, בטוחה ומשתלמת הרבה יותר.נכון לחציון הראשון של שנת 2025 מלאי הדירות של מגוריט עומד על כ-2,150 יח\"ד, מתוכן כ- 1000 מניבות ומאוכלסות ויתרתן בשלבי תכנון וביצוע.מגוריט היא חברה ציבורית הנסחרת בבורסה לני\"ע בתל אביב ומתוקף כך פועלת בשקיפות מלאה ותוך דיווח ציבורי מלא.","name":"מגוריט ישראל בע\"מ","logo":"https://cdn.yad2.treedis.com/clients/1001259/logo.png"}],"flag":"פרויקט במבצע","info":"דירות ארבעה חדרים כולל ממ\"ד בעלות תכנון פנים אופטימלי עם מרפסת שמש רחבת היקף וחניה תת קרקעית רגילה.פרויקט הרימון ממוקם בלב העניינים של קרית אונו בצמוד לקניון ולמוסדות תרבות וחינוך מובילים.הדירות בפרויקט כוללת בין היתר חדרים מרווחים, מטבח משודרג, חדרים מרווחים, מרפסת שמש רחבת היקף, חניה תת קרקעית רגילה, לובי מפואר ועוד הפתעות. ממוקם באזור נגיש עם קרבה לצירי תנועה ראשיים ותחבורה ציבורית ובסמוך לסביבה ירוקה של גנים ופארקים..אפשר לתכנן קדימה - הסכם שכירות שייתן לכם שקט ל-5 השנים הקרובות עם אפשרות ל-5 שנים נוספות. אם תרצו לעזוב, אפשר לעשות זאת אחרי שנה אחת בלבד, בלי קנסות יציאה ובלי למצוא מחליפים.מחיר ידוע מראש - אצלנו אין הפתעות וקפיצות לא מוסברות במחיר. שכר הדירה ידוע מראש והשינויים בו מפורטים בדיוק בחוזה השכירות.מישהו מטפל בכם - כל דירות מגוריט מנוהלות על ידי צוות מנהלי נכסים זמין, מקצועי ומחויב שנותן מענה מהיר ויעיל.לא משלמים תיווך -  ההשכרה מתבצעת ישר מולנו, בלי מתווכים ובלי תשלומים מיותרים.הצעה מיוחדת לתחילת שיווק – מחירי PRE-RENT, החל מ-₪7,500.","projectName":"קרית אונו , הרימון","projectLogo":"https://cdn.yad2.treedis.com/projects/1018941/assets/logo/0963a6c6-b302-41e6-baa5-23bff2945e77.jpg","coverImage":"https://cdn.yad2.treedis.com/projects/1018941/assets/mainImage/22f2f948-0e1b-4320-a1ca-070675db19f5.jpg","images":["https://cdn.yad2.treedis.com/projects/1018941/assets/gallery/1a17413b-3fc7-44ac-9703-3f53ae643a66.jpg"],"previewType":"2d"},"address":{"topArea":{"id":"2","text":"מרכז"},"area":{"id":"10","text":"בקעת אונו"},"city":{"id":"2620","text":"קרית אונו"},"neighborhood":{"id":"360","text":"קיראון"},"street":{"id":"0218","text":"הרימ