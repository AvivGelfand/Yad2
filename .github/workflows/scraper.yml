name: Yad2 Real Estate Scraper

# ─────────────────────────────────────────────────────────────────────────────
# NOTE — best-effort on GitHub-HOSTED runners.
# Yad2 sits behind Radware Bot Manager, which blocks datacenter/Azure IPs, so
# most runs here will hit a 403 / "Radware Page" challenge and scrape 0 listings
# (the browser engine retries with a fresh context, and occasionally a runner IP
# slips through — re-running can help). For RELIABLE results, register a
# self-hosted runner on a residential connection and switch `runs-on` to
# `self-hosted`, or run scripts/main.py from a local cron/launchd:
#     */30 * * * *  cd /path/to/Yad2 && ./.venv/bin/python scripts/main.py
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Every 30 minutes; the step below no-ops outside 07:00–23:00 Israel time.
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Allow manual trigger from the GitHub UI

# Never let two scraper runs overlap (they share the seen-properties cache).
concurrency:
  group: yad2-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest   # best-effort; see NOTE above (Radware often blocks this)
    timeout-minutes: 25

    steps:
      - name: Check Israel time window (07:00-23:00 IST/IDT)
        id: time_check
        run: |
          set -euo pipefail
          ISRAEL_HOUR=$(TZ='Asia/Jerusalem' date +%H)
          echo "Current Israel time: $(TZ='Asia/Jerusalem' date '+%Y-%m-%d %H:%M:%S %Z')"
          if [ "$ISRAEL_HOUR" -ge 7 ] && [ "$ISRAEL_HOUR" -lt 23 ]; then
            echo "✅ Within operating hours"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "⏸️ Outside operating hours (hour ${ISRAEL_HOUR})"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.time_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.time_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.time_check.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install browser (patchright chromium)
        if: steps.time_check.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          # --with-deps installs the required system libraries on the CI runner.
          python -m patchright install --with-deps chromium

      - name: Set up Google Sheets credentials
        if: steps.time_check.outputs.should_run == 'true'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          mkdir -p config
          echo "$GOOGLE_CREDENTIALS_JSON" > config/credentials.json

      - name: Create data directory
        if: steps.time_check.outputs.should_run == 'true'
        run: mkdir -p data

      - name: Restore seen properties database
        if: steps.time_check.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        id: cache-seen-properties
        with:
          path: data/seen_properties.json
          key: seen-properties-${{ github.run_id }}
          restore-keys: |
            seen-properties-

      - name: Run scraper
        if: steps.time_check.outputs.should_run == 'true'
        env:
          GOOGLE_CREDENTIALS_FILE: config/credentials.json
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_NOTIFICATIONS: ${{ secrets.ENABLE_NOTIFICATIONS }}
          NOTIFY_ON_NEW_PROPERTIES: ${{ secrets.NOTIFY_ON_NEW_PROPERTIES }}
          NOTIFY_ON_ERROR: ${{ secrets.NOTIFY_ON_ERROR }}
          DATABASE_PATH: data/seen_properties.json
          REQUEST_DELAY: ${{ secrets.REQUEST_DELAY }}
        run: python scripts/main.py

      - name: Save seen properties database
        if: always() && steps.time_check.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/seen_properties.json
          key: seen-properties-${{ github.run_id }}

      - name: Upload logs on failure
        if: failure() && steps.time_check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: |
            data/
            *.log
          retention-days: 7

      - name: Clean up credentials
        if: always() && steps.time_check.outputs.should_run == 'true'
        run: rm -f config/credentials.json
