name: Dump secrets (TEMPORARY - delete after use)

# One-shot manual workflow to export this repo's Actions secrets to an artifact
# so they can be pulled into a local .env. Secrets are write-only via the API,
# so a workflow is the only way to read them back. DELETE this file, the run,
# and the artifact right after use.
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Write all secrets to a file
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: printf '%s' "$ALL_SECRETS" > secrets.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: secrets
          path: secrets.json
          retention-days: 1
